services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbrix
      POSTGRES_PASSWORD: dbrix
      POSTGRES_DB: dbrix
    ports:
      - "${DBRIX_PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbrix -d dbrix"]
      interval: 2s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.0
    command: ["--default-authentication-plugin=mysql_native_password"]
    environment:
      MYSQL_ROOT_PASSWORD: dbrix
      MYSQL_DATABASE: dbrix
      MYSQL_USER: dbrix
      MYSQL_PASSWORD: dbrix
    ports:
      - "${DBRIX_MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin status -h127.0.0.1 -udbrix -pdbrix"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "${DBRIX_REDIS_PORT:-6379}:6379"

  mongo:
    image: mongo:7
    ports:
      - "${DBRIX_MONGO_PORT:-27017}:27017"
