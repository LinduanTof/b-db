default_connection: local-sqlite

ui:
  # auto | en | zh
  language: auto
  # default | dracula | gruvbox | nord | catppuccin | solarized-light
  theme: default
  # manual | auto: F2 focuses the active pane; auto follows focus
  focus_mode: manual

query:
  timeout: 30s
  max_rows: 1000   # table browsing page size; editor queries are unlimited

connections:
  - name: local-sqlite
    type: sqlite
    path: ./testdata/demo.db

  # PostgreSQL example. ${PG_PASSWORD} must be set before starting bdb;
  # a missing variable is reported as an error instead of silently using "".
  # - name: local-pg
  #   type: postgres
  #   host: 127.0.0.1
  #   port: 5432
  #   user: postgres
  #   password: ${PG_PASSWORD}
  #   database: bdb
  #   sslmode: disable

  # MySQL / MariaDB (supported). Uncomment and set MYSQL_PASSWORD in the environment.
  # - name: local-mysql
  #   type: mysql
  #   host: 127.0.0.1
  #   port: 3306
  #   user: bdb
  #   password: ${MYSQL_PASSWORD}
  #   database: bdb

  # Redis / MongoDB
  # - name: cache
  #   type: redis
  #   addr: 127.0.0.1:6379
  #   password: ${REDIS_PASSWORD}
  #   db: 0
  # - name: docs
  #   type: mongo
  #   uri: mongodb://127.0.0.1:27017

  # Read-only connection: editing is disabled for this connection.
  # - name: prod
  #   type: postgres
  #   host: db.example.com
  #   port: 5432
  #   user: readonly
  #   password: ${PROD_PASSWORD}
  #   database: app
  #   read_only: true
